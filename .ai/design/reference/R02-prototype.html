<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Roomlist Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: a calm workshop. A sticky top bar, a tab bar for the three project sections,
   one wide working column, and a task drawer that slides in from the right. */
:root {
  --bg: #F2F4F1;
  --surface: #FFFFFF;
  --surface-2: #E8ECE7;
  --ink: #17211D;
  --ink-2: #55635C;
  --line: #D6DCD5;
  --accent: #1E6B5A;
  --on-accent: #FFFFFF;
  --accent-soft: #DCEBE5;
  --bar-est: #A9CDC2;
  --good: #2E7D4F;
  --bad: #B83A2B;
  --bad-soft: #F7E3DF;
  --warn-soft: #F6EBD3;
  --shadow: 0 10px 30px rgba(23, 33, 29, .14);
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --topbar: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101513; --surface: #181F1C; --surface-2: #232C28; --ink: #E8EEEA; --ink-2: #9CAAA3; --line: #2E3834;
    --accent: #4CB59B; --on-accent: #0B1713; --accent-soft: #1D3A32; --bar-est: #2F5D51;
    --good: #5DBB84; --bad: #F08A7B; --bad-soft: #3A1F1B; --warn-soft: #3A3020; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101513; --surface: #181F1C; --surface-2: #232C28; --ink: #E8EEEA; --ink-2: #9CAAA3; --line: #2E3834;
  --accent: #4CB59B; --on-accent: #0B1713; --accent-soft: #1D3A32; --bar-est: #2F5D51;
  --good: #5DBB84; --bad: #F08A7B; --bad-soft: #3A1F1B; --warn-soft: #3A3020; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; min-height: 100%; }
body.is-dragging { cursor: grabbing; user-select: none; -webkit-user-select: none; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 28px; line-height: 1.15; }
h2 { font-size: 20px; }
h3 { font-size: 17px; display: flex; align-items: baseline; gap: 8px; }
h3 em { font-style: normal; font-family: var(--body); font-size: 13px; color: var(--ink-2); font-weight: 500; }
h4 { font-size: 14px; margin: 18px 0 8px; }
p { margin: 0 0 10px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, input:disabled, select:disabled, textarea:disabled { cursor: not-allowed; opacity: .55; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.ic { flex: none; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.pad { padding: 0 16px 14px; }
.top-gap { margin-top: 14px; }
.lbl { display: block; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.neg { color: var(--bad); }
.pos { color: var(--good); }
.hide-s { display: inline; }
b { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { min-height: var(--topbar); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px var(--gutter-r) 6px var(--gutter-l); }
.top-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; }
.brand-mark { display: grid; grid-template-columns: repeat(3, 8px); gap: 2px; height: 22px; }
.brand-mark i:nth-child(1) { background: #4F86B8; } .brand-mark i:nth-child(2) { background: #C79A2B; } .brand-mark i:nth-child(3) { background: #4E9A6B; }
.brand-mark i { border-radius: 2px; }
.crumb { display: flex; align-items: center; gap: 8px; min-width: 0; }
.crumb-name { font-family: var(--display); font-weight: 600; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.role-pill { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.role-pill.r-owner { background: var(--accent-soft); color: var(--accent); }
.avatars { display: flex; }
.avatars .avatar { margin-left: -6px; border: 2px solid var(--surface); }
.avatars .avatar:first-child { margin-left: 0; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--av, #7D8A94); flex: none; }
.avatar.ghost { background: var(--surface-2); color: var(--ink-2); }
.icon-btn { background: none; border: 0; padding: 6px; border-radius: 8px; display: inline-grid; place-items: center; color: var(--ink-2); min-width: 32px; min-height: 32px; }
.icon-btn:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; position: relative; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { background: var(--accent); filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.small { min-height: 30px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.btn.wide { width: 100%; margin-top: 10px; }
.btn.danger { color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.on { background: var(--warn-soft); border-color: #C79A2B; }
.btn.ai-btn { border-color: var(--accent); color: var(--accent); }
.proto-btn .armed { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.proto { position: absolute; top: 100%; right: var(--gutter-r); width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 14px; margin-top: 6px; }
.proto-h { display: flex; justify-content: space-between; align-items: center; }
.proto-s { display: grid; gap: 6px; }
.proto-row { display: flex; gap: 8px; flex-wrap: wrap; }
.proto-jump { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.proto-jump button { text-align: left; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 13px; }
.proto-jump button:hover { border-color: var(--accent); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; padding: 2px; background: var(--bg); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }

/* ---------- stage and tabs ---------- */
.stage { padding: 0 var(--gutter-r) 40px var(--gutter-l); }
.page { max-width: 880px; margin: 0 auto; padding: 22px 0 24px; display: grid; gap: 16px; }
.page.wide { max-width: 980px; }
.page.narrow { max-width: 560px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.head-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--topbar)); z-index: 30; display: flex; gap: 4px; background: var(--bg); padding: 8px var(--gutter-r) 0 var(--gutter-l); border-bottom: 1px solid var(--line); }
.tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 0; background: none; border-bottom: 3px solid transparent; font-weight: 600; color: var(--ink-2); margin-bottom: -1px; }
.tab em { font-style: normal; font-size: 12px; background: var(--surface-2); padding: 1px 7px; border-radius: 99px; }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }
.tabs-wrap { padding: 0; }
.stage.has-drawer { padding-right: calc(460px + var(--gutter-r)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--surface); min-height: 36px; color: var(--ink-2); }
.search input { border: 0; background: none; outline: none; min-width: 0; width: 170px; color: var(--ink); }
.search:focus-within { outline: 2px solid var(--accent); }

/* ---------- forms ---------- */
.field { display: grid; gap: 5px; margin-bottom: 12px; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; }
.field small { color: var(--ink-2); font-size: 12.5px; }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; min-height: 36px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input[aria-invalid="true"] { border-color: var(--bad); }
input[type="checkbox"] { width: 18px; height: 18px; min-height: 0; padding: 0; accent-color: var(--accent); }
textarea { resize: vertical; }
.err { color: var(--bad); font-size: 13px; font-weight: 500; }
.err:empty { display: none; }
.field:has([data-validate]) .err:empty { display: block; min-height: 18px; }
.err.full { grid-column: 1 / -1; padding: 0 0 6px 40px; }
.inp-row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.inp-row input { flex: 1 1 140px; width: auto; }
.inp-row select { flex: 1 1 120px; width: auto; }
.check-row { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; margin: 4px 0 14px; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); margin-bottom: 8px; }
.banner > div { display: grid; flex: 1; gap: 2px; font-size: 14px; }
.banner span { color: var(--ink-2); font-size: 13.5px; }
.banner.bad { background: var(--bad-soft); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); color: var(--ink); }
.banner.bad .ic { color: var(--bad); }
.banner.ok { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.link-row { background: none; border: 0; padding: 0; text-align: left; }

/* ---------- sign in ---------- */
.auth { min-height: calc(100dvh - var(--topbar)); display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
.auth-art { padding: 48px max(24px, 5vw); background: var(--accent-soft); display: flex; flex-direction: column; justify-content: center; gap: 12px; }
.auth-art h2 { font-size: clamp(28px, 4vw, 44px); line-height: 1.05; }
.auth-art p { color: var(--ink-2); max-width: 36ch; font-size: 16px; }
.swatches { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 18px; max-width: 420px; }
.swatch { background: var(--surface); border-radius: 6px; overflow: hidden; box-shadow: 0 1px 0 var(--line); }
.swatch::before { content: ""; display: block; height: 64px; background: var(--c); }
.swatch span { display: block; padding: 8px 10px 0; font-size: 11px; letter-spacing: .08em; color: var(--ink-2); }
.swatch b { display: block; padding: 0 10px 10px; font-size: 14px; }
.auth-card { padding: 40px max(20px, 5vw); display: flex; align-items: center; }
.auth-card form { width: min(400px, 100%); margin: 0 auto; }
.auth-card h1 { margin-bottom: 18px; }
.or { display: grid; place-items: center; margin: 14px 0; position: relative; color: var(--ink-2); font-size: 12.5px; }
.or::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid var(--line); }
.or span { position: relative; background: var(--bg); padding: 0 10px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.switch { text-align: center; margin-top: 16px; }
.hint { color: var(--ink-2); font-size: 13px; text-align: center; }

/* ---------- projects ---------- */
.proj { display: grid; gap: 10px; align-content: start; }
.proj-open { background: none; border: 0; padding: 0; text-align: left; }
.proj-open h3 { font-size: 19px; }
.proj-open:hover h3 { color: var(--accent); }
.meter { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.proj-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.proj-nums b { font-family: var(--display); font-size: 18px; }
.proj-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.proj-act { display: flex; gap: 2px; }

/* ---------- tasks ---------- */
.strip { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.strip > div { padding: 12px 16px; border-right: 1px solid var(--line); min-width: 0; }
.strip > div:last-child { border-right: 0; }
.strip b { font-family: var(--display); font-size: 20px; display: block; }
.filters { display: grid; gap: 10px; }
.chips-row { display: flex; gap: 6px; flex-wrap: wrap; }
.filters-ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters-ctl select { width: auto; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c, #7D8A94); flex: none; display: inline-block; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 2px 9px; min-height: 24px; border-radius: 99px; background: color-mix(in srgb, var(--c) 15%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 38%, var(--line)); color: var(--ink); white-space: nowrap; }
.chip .x { background: none; border: 0; padding: 0 0 0 2px; font-size: 15px; line-height: 1; color: var(--ink-2); }
.btn-chip { min-height: 32px; padding: 3px 12px; }
.btn-chip.on { background: color-mix(in srgb, var(--c) 40%, var(--surface)); border-color: var(--c); }
.quick { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
.quick-row { display: flex; align-items: center; gap: 10px; color: var(--ink-2); flex-wrap: wrap; }
.quick-row input { flex: 1 1 200px; width: auto; border: 0; min-height: 38px; padding: 0 4px; background: none; font-size: 16px; color: var(--ink); }
.quick-row input:focus { outline: none; }
.quick-row select { width: auto; flex: 0 1 150px; }
.quick-hint { font-size: 13px; padding: 4px 4px 0 28px; color: var(--ink); }
.quick-hint.muted { color: var(--ink-2); }
.note { margin: 0; font-size: 13px; color: var(--ink-2); background: var(--warn-soft); padding: 8px 12px; border-radius: 10px; }
.tree { padding: 4px 0; overflow: hidden; }
.row { display: grid; grid-template-columns: 28px 22px 24px minmax(0, 1fr) auto 34px; align-items: center; gap: 6px; padding: 8px 8px 8px calc(6px + var(--d, 0) * 22px); border-bottom: 1px solid color-mix(in srgb, var(--line) 70%, transparent); background: var(--surface); position: relative; }
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface)); }
.row.sel { background: var(--accent-soft); }
.row.dim { opacity: .5; }
.row.done .title { text-decoration: line-through; color: var(--ink-2); }
.row.dragging { opacity: .35; }
.row.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.row.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
.row.drop-inside { background: var(--accent-soft); outline: 2px dashed var(--accent); outline-offset: -3px; }
.row.drop-bad { outline: 2px solid var(--bad); outline-offset: -3px; }
.row.ghost { position: fixed; z-index: 100; pointer-events: none; box-shadow: var(--shadow); border-radius: 12px; border: 1px solid var(--accent); opacity: .95; }
.handle { background: none; border: 0; color: var(--ink-2); cursor: grab; touch-action: none; padding: 4px; border-radius: 6px; display: grid; place-items: center; min-height: 32px; opacity: .55; }
.row:hover .handle, .handle:focus-visible { opacity: 1; }
.handle:active { cursor: grabbing; }
.chev { background: none; border: 0; padding: 2px; color: var(--ink-2); border-radius: 6px; display: grid; place-items: center; }
.chev .ic { transition: transform .15s; }
.chev.open .ic { transform: rotate(90deg); }
.chev-sp { display: block; width: 22px; }
.chk { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--ink-2); background: var(--surface); display: inline-grid; place-items: center; padding: 0; color: var(--on-accent); flex: none; }
.chk.on { background: var(--accent); border-color: var(--accent); }
.chk.big { width: 26px; height: 26px; }
.row-main { min-width: 0; display: grid; gap: 4px; }
.title { background: none; border: 0; padding: 0; text-align: left; font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.title:hover { color: var(--accent); }
.title.strike { text-decoration: line-through; color: var(--ink-2); }
.row-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.prog { font-size: 12px; color: var(--ink-2); }
.row-cost { display: grid; justify-items: end; font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; }
.c-est { color: var(--ink-2); }
.c-sp { font-weight: 600; }
.row-menu { position: relative; }
.menu { position: absolute; right: 0; top: 100%; z-index: 25; min-width: 180px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 4px; display: grid; }
.menu > button { text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.menu > button:hover:not(:disabled) { background: var(--surface-2); }
.menu .danger { color: var(--bad); }
.sub-add { grid-template-columns: 28px 22px 24px minmax(0, 1fr) auto auto; background: var(--accent-soft); }
.sub-add .err { grid-column: 4 / -1; }

/* ---------- drawer ---------- */
.drawer { position: fixed; z-index: 50; top: calc(env(safe-area-inset-top, 0px) + var(--topbar)); bottom: 0; right: 0; width: 460px; max-width: 100%; background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-right: env(safe-area-inset-right, 0px); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 12px 10px 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
.crumbs { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drawer-body { overflow: auto; padding: 16px 18px max(28px, env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.d-title { display: flex; gap: 10px; align-items: center; }
.title-input { font-family: var(--display); font-size: 21px; font-weight: 600; border-color: transparent; padding: 4px 8px; }
.title-input:hover { border-color: var(--line); }
.d-labels { display: grid; gap: 6px; }
.d-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.menu-wrap { position: relative; }
.wide-menu { left: 0; right: auto; min-width: 230px; }
.menu-new { display: flex; gap: 6px; padding: 6px; border-top: 1px solid var(--line); margin-top: 4px; }
.menu-new input { min-height: 32px; }
.wide-menu .err { padding: 0 10px 6px; }
.cost-card { border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; background: var(--bg); }
.cost-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

.field.inline { margin: 0; }

}
// ---------- DOM events ----------
document.addEventListener('click', (e) => {
    const target = e.target;

        toasts = toasts.filter((x) => x !== t);
        renderToasts();
        t?.undo?.();

    }
    const c = target.closest('[data-toast-close]');
    if (c) {
        toasts = toasts.filter((x) => x.id !== Number(c.dataset.toastClose));
        renderToasts();
        return;
    }
    if (!appEl.contains(target))
        return;
    const el = target.closest('[data-act]');
    if (!el) {
        let changed = false;
        if (S.rowMenu && !target.closest('.row-menu')) {
            S.rowMenu = null;
            changed = true;
        }
        if (S.labelMenu && !target.closest('.menu-wrap')) {

            changed = true;

        if (S.protoOpen && !target.closest('.proto')) {

});
document.addEventListener('submit', (e) => {

});
document.addEventListener('change', (e) => {
    const t = e.target;
    const p = P();
    if (t.id)
        S.drafts[t.id] = t.type === 'checkbox' ? String(t.checked) : t.value;
    if (t.id === 'np-defaults')
        S.newProjDefaults = t.checked;
    if (t.id === 'np-cur')
        S.newProjCurrency = t.value;
    const ch = t.dataset?.change;
    if (!ch)
        return;
    const task = taskOf(p, S.overlay?.id);
    if (ch === 'filter-status') {
        S.filters.status = t.value;
        render();
    }
    else if (ch === 'save-title' && task) {
        const v = t.value.trim();
        if (!v) {
            setErr('d-title', 'A task needs a title.');
            return;
        }
        if (v.length > 200) {
            setErr('d-title', 'Use 200 characters or fewer.');
            return;
        }
        task.title = v;
        setErr('d-title', '');
        render();
        toast('Saved');
    }
    else if (ch === 'save-notes' && task) {
        task.notes = t.value;
        toast('Notes saved');
    }
    else if (ch === 'save-estimate' && task) {
        const v = t.value.trim();
        if (!v) {
            delete task.estimate;
            setErr('d-est', '');
            render();
            return;
        }
        const n = parseMoney(v);
        if (isNaN(n)) {
            setErr('d-est', 'Enter an amount like 1200 or 1200.50.');
            return;
        }
        task.estimate = { ...est(n, 'manual', 0.2) };
        setErr('d-est', '');
        render();
        toast('Estimate saved');
    }
    else if (ch === 'rename-label') {
        const l = labelOf(p, t.dataset.id ?? '');
        if (!l)
            return;
        const v = t.value.trim();
        const m = labelNameError(p, v, l.id);
        setErr('ln-' + l.id, m);
        if (!m) {
            l.name = v;
            toast('Label renamed');
        }
    }
    else if (ch === 'member-role') {
        const m = p.members.find((x) => x.id === t.dataset.id);
        if (m) {
            m.role = t.value;
            toast('Role updated');
        }
    }
});
document.addEventListener('focusout', (e) => {
    const t = e.target;

        return;
    setErr(t.id, validateField(t.id, v));
});
document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (e.key === 'Escape') {
        if (drag) {
            endDrag(false);
            return;
        }
        if (S.protoOpen || S.rowMenu || S.labelMenu || S.overlay || S.addSub) {
            S.protoOpen = false;
            S.rowMenu = null;
            S.labelMenu = false;
            S.overlay = null;
            S.addSub = null;
            S.ai = null;
            render();
        }
        return;
    }
    if (e.key === 'Tab' && t.id === 'q-add') {
        const p = P();
        if (!e.shiftKey && S.lastAdded && taskOf(p, S.lastAdded)) {
            const d = depthOf(p, taskOf(p, S.lastAdded));
            if (d < MAX_DEPTH) {
                e.preventDefault();
                S.quickParent = S.lastAdded;
                S.focus = '#q-add';
                render();
            }
            else {
                e.preventDefault();
                setErr('q-add', 'Tasks can be nested up to ' + MAX_DEPTH + ' levels.');

        }
        else if (e.shiftKey && S.quickParent) {

            S.focus = '#q-add';
            render();

});
let drag = null;
function clearDropMarks() { appEl.querySelectorAll('.drop-before,.drop-after,.drop-inside,.drop-bad').forEach((n) => n.classList.remove('drop-before', 'drop-after', 'drop-inside', 'drop-bad')); }
document.addEventListener('pointerdown', (e) => {
    const h = e.target.closest('[data-drag]');
    if (!h || h.hasAttribute('disabled'))
        return;
    if (filtersActive()) {
        toast('Clear the filters to re-order tasks.', 'error');
        return;
    }
    if (!can())
        return;
    e.preventDefault();
    const row = h.closest('.row');
    const r = row.getBoundingClientRect();
    const ghost = row.cloneNode(true);
    ghost.classList.add('ghost');
    ghost.style.width = r.width + 'px';
    ghost.style.left = r.left + 'px';
    ghost.style.top = r.top + 'px';
    document.body.appendChild(ghost);
    row.classList.add('dragging');
    document.body.classList.add('is-dragging');
    drag = { id: row.dataset.id ?? '', ghost, row, over: null, pid: e.pointerId };
});
document.addEventListener('pointermove', (e) => {
    if (!drag)
        return;
    drag.ghost.style.top = (e.clientY - 20) + 'px';
    if (e.clientY < 90)
        window.scrollBy(0, -12);
    else if (e.clientY > window.innerHeight - 90)
        window.scrollBy(0, 12);
    clearDropMarks();
    drag.over = null;
    const under = document.elementFromPoint(e.clientX, e.clientY);
    const row = under ? under.closest('.tree .row[data-id]') : null;
    if (!row || row === drag.row)
        return;
    const rect = row.getBoundingClientRect();
    const y = (e.clientY - rect.top) / rect.height;
    const zone = y < 0.3 ? 'before' : y > 0.7 ? 'after' : 'inside';
    const tid = row.dataset.id ?? '';
    const p = P();
    const bad = descendants(p, drag.id).some((d) => d.id === tid);
    row.classList.add(bad ? 'drop-bad' : 'drop-' + zone);
    if (!bad)
        drag.over = { id: tid, zone };
});
function endDrag(drop) {
    if (!drag)
        return;
    const d = drag;
    drag = null;
    d.ghost.remove();
    d.row.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    clearDropMarks();
    if (!drop || !d.over)
        return;
    const p = P();
    if (consumeFail()) {
        render();
        toast('Couldn\'t move the task. Someone may have changed the list. Your view was restored.', 'error');
        return;
    }
    const undo = snapshot();
    const res = moveTask(p, d.id, d.over.id, d.over.zone);
